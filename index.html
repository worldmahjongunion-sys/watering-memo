<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水やりメモ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E6F8E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="水やりメモ">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#EDF1EC; --card:#fff; --ink:#1E2A22; --muted:#5E6D62; --line:#D5DCD4;
    --water:#2E6F8E; --dry:#A8681A; --dry-bg:#FDF8EF; --dry-line:#E3C79A;
    --done:#4A7A52; --done-bg:#E8F1E7; --soil:#3A2E24; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;
    font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px}
  .bar{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
  h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:21px;margin:0;letter-spacing:.06em}
  .today{color:var(--muted);font-size:14px}

  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
  .box.ask{border:2px solid var(--water)}
  .label{font-size:14px;color:var(--muted);margin:0 0 8px}
  .wbtns{display:flex;gap:6px}
  .wbtn{flex:1;padding:11px 2px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:15px;font-family:inherit;cursor:pointer}
  .wbtn.on{background:var(--water);border-color:var(--water);color:#fff;font-weight:600}
  .wsay{font-size:14px;color:var(--muted);margin:8px 0 0}
  .placeline{font-size:14px;color:var(--muted);margin:0 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .placeline b{color:var(--ink);font-weight:600}
  .linkbtn{border:none;background:none;padding:0;color:var(--water);font-size:14px;font-family:inherit;text-decoration:underline;cursor:pointer}
  .placebox{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px;background:#FAFCFA}
  .placebox input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit;margin-bottom:8px}
  .placebox .addbtn{width:100%}
  .plist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .plist button{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:15px;font-family:inherit;text-align:left;cursor:pointer}
  .pmsg{font-size:13px;color:var(--muted);margin:8px 0 0}

  .todo{background:var(--dry-bg);border:1px solid var(--dry-line);border-radius:var(--r);padding:14px;margin-bottom:18px}
  .todo p.label{color:var(--dry)}
  .todo-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--dry-line)}
  .todo-row:last-child{border-bottom:none}
  .todo-name{font-size:18px;font-weight:600}
  .todo-since{font-size:13px;color:var(--muted);margin-left:6px}
  .mini{padding:9px 16px;border:none;border-radius:10px;background:var(--water);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;flex-shrink:0}
  .rest{font-size:16px;color:var(--muted);margin:0}

  .pot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px}
  .pot.due{background:var(--dry-bg);border-color:var(--dry-line)}
  .pot.done{opacity:.7}
  .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .idbox{display:flex;gap:11px;align-items:flex-start}
  .thumb{width:54px;height:54px;object-fit:cover;border-radius:10px;flex-shrink:0}
  .name{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:20px;font-weight:600;margin:0}
  .sub{font-size:13px;color:var(--muted);margin:2px 0 0}
  .fix{background:none;border:none;color:#9AA79E;font-size:14px;font-family:inherit;cursor:pointer;padding:4px 6px;flex-shrink:0}

  .lead{margin:11px 0 0}
  .big{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--water)}
  .word{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:23px;font-weight:600}
  .word.due{color:var(--dry)} .word.done{color:var(--done);font-size:20px} .word.none{color:var(--muted);font-size:18px}
  .since{font-size:13px;color:var(--muted);margin:2px 0 0}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
  .dot.on{background:var(--soil);border-color:var(--soil)}
  .dot.grace{border-color:var(--water);border-style:dashed}

  .acts{display:flex;gap:8px;margin-top:13px}
  .go{flex:1;padding:13px;border:none;border-radius:12px;background:var(--water);color:#fff;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer}
  .go.fin{background:var(--done-bg);color:var(--done);text-align:center}
  .undo{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:15px;font-family:inherit;cursor:pointer}

  .edit{background:#F7F9F6;border-radius:10px;padding:12px;margin-top:11px}
  .edit label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  .edit .field{margin-bottom:11px}
  input[type=text],select{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .toggle{display:flex;gap:6px}
  .toggle button{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-family:inherit;font-size:15px;cursor:pointer}
  .toggle button.on{background:var(--soil);border-color:var(--soil);color:#fff;font-weight:600}
  .del{background:none;border:none;color:var(--dry);font-size:14px;font-family:inherit;text-decoration:underline;cursor:pointer;padding:0}
  .photo-btn{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-size:14px;cursor:pointer}
  .photo-btn.busy{opacity:.55}
  .ai-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:11px}
  .ai-box h4{margin:0 0 3px;font-size:16px;color:var(--ink)}
  .ai-box .conf{font-size:12px;color:var(--muted);margin:0 0 8px}
  .ai-box dl{margin:0 0 9px}
  .ai-box dt{font-size:12px;color:var(--muted);margin-top:6px}
  .ai-box dd{margin:1px 0 0;font-size:14px;line-height:1.6}
  .ai-use{width:100%;padding:10px;border:none;border-radius:9px;background:var(--soil);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
  .ai-err{color:var(--dry);font-size:13px;margin:0}

  .add label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  .add .thumb-row{display:flex;align-items:center;gap:10px}
  .add h2{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:17px;margin:0 0 10px;font-weight:600}
  .addbtn{width:100%;padding:13px;border:none;border-radius:11px;background:var(--soil);color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:24px 10px}
  .note{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;line-height:1.8}
  :focus-visible{outline:3px solid var(--water);outline-offset:2px}
  .hide{display:none}

  /* ===== 控え（バックアップ） ===== */
  .bkremind{background:var(--dry-bg);border:1px solid var(--dry-line);border-radius:var(--r);padding:12px 40px 12px 14px;margin-bottom:14px;font-size:15px;position:relative}
  .bkremind p{margin:0 0 8px}
  .bkremind .x{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;font-family:inherit}
  .bk h2{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:17px;margin:0 0 6px;font-weight:600}
  .bk .desc{font-size:14px;color:var(--muted);margin:0 0 10px}
  .bk .addbtn{margin-top:8px}
  .bk .sub2{width:100%;padding:12px;border:1px solid var(--soil);border-radius:11px;background:#fff;color:var(--soil);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:8px}
  .bk .info{font-size:13px;color:var(--muted);margin:6px 0 0}
  .bk .choice{background:var(--dry-bg);border:1px solid var(--dry-line);border-radius:10px;padding:12px;margin-top:10px;font-size:14px}
  .bk .choice p{margin:0;white-space:pre-line}
  .bk .err{color:#B3261E;font-size:14px;margin:8px 0 0}
  .bk .ok{color:var(--done);font-size:14px;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar"><h1>水やりメモ</h1><span class="today" id="todayLabel"></span></div>

  <div class="bkremind hide" id="bkRemind">
    <p id="bkRemindText"></p>
    <button class="mini" id="bkRemindBtn">控えを書き出す</button>
    <button class="x" id="bkRemindClose" aria-label="閉じる">×</button>
  </div>

  <div class="box ask" id="wbox">
    <p class="placeline" id="placeLine"></p>
    <div class="placebox hide" id="placeBox">
      <label class="label" for="placeInput">お住まいの市区町村</label>
      <input type="text" id="placeInput" placeholder="例：大阪市　枚方市　高槻市">
      <button class="addbtn" id="placeSearch">この場所をさがす</button>
      <div class="plist" id="placeList"></div>
      <p class="pmsg" id="placeMsg"></p>
    </div>
    <p class="label">今日の天気は？</p>
    <div class="wbtns" id="wbtns"></div>
    <p class="wsay" id="wsay"></p>
  </div>

  <div id="todo"></div>
  <div id="pots"></div>

  <div class="box add">
    <h2>鉢を増やす</h2>
    <div class="field" style="margin-bottom:10px">
      <label>写真から始める</label>
      <div id="newShot"></div>
      <div id="newAiBox"></div>
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>名前</label>
      <input type="text" id="newName" placeholder="鉢の名前（例：玄関のカポック）">
    </div>
    <div class="toggle" id="newWhere" style="margin-bottom:10px">
      <button data-w="indoor" class="on">室内</button>
      <button data-w="outdoor">屋外</button>
    </div>
    <div class="field" style="margin-bottom:10px">
      <select id="newInterval">
        <option value="1">1日おき</option><option value="2">2日おき</option>
        <option value="3" selected>3日おき</option><option value="4">4日おき</option>
        <option value="5">5日おき</option><option value="7">7日おき</option>
        <option value="10">10日おき</option><option value="14">14日おき</option>
      </select>
    </div>
    <button class="addbtn" id="addBtn">増やす</button>
  </div>

  <div class="box bk" id="bkBox">
    <h2>データの控え（バックアップ）</h2>
    <p class="desc">鉢・写真・場所などを、1つのファイルにまとめてスマホに保存します。スマホのデータ消去などで消えてしまっても、このファイルを読み込めば元に戻せます。</p>
    <button class="addbtn" id="bkExport">控えを書き出す</button>
    <p class="info" id="bkLast"></p>
    <button class="sub2" id="bkImport">控えを読み込む</button>
    <div class="choice hide" id="bkChoice">
      <p id="bkChoiceText"></p>
      <button class="addbtn" id="bkMerge">今のデータに追加する</button>
      <button class="sub2" id="bkOverwrite">上書きする</button>
      <button class="sub2" id="bkCancel">やめる</button>
    </div>
    <p class="err" id="bkErr"></p>
    <p class="ok" id="bkOk"></p>
    <button class="sub2 hide" id="bkUndo">読み込む前の状態に戻す</button>
    <p class="info" id="bkUndoInfo"></p>
  </div>

  <p class="note">
    記録はこの端末の中だけに残ります。<br>
    「直す」から、名前・置き場所・間隔・写真をいつでも変えられます。
  </p>
</div>

<input type="file" id="fileIn" accept="image/*" capture="environment" class="hide">
<input type="file" id="bkFile" class="hide">

<script>
/* ===== 保存 ===== */
var KEY='mizuyari-v1', mem=null;
/* 植物しらべ中継サーバー */
var AI_URL='https://plant-ai.world-mahjong-union.workers.dev';
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return mem||{pots:[],weather:null};}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){
  alert('保存できませんでした。写真が多すぎるかもしれません。');}}
var S=load();
if(!S.pots) S.pots=[];

/* ===== 日付 ===== */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return ymd(new Date());}
function diff(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);
  return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/86400000);}
(function(){var d=new Date();
  document.getElementById('todayLabel').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（'+['日','月','火','水','木','金','土'][d.getDay()]+'）';})();

/* ===== 天気 ===== */
var WEATHER={
  hot:{label:'暑い',out:-1,inn:-1,say:'乾きが早いので1日早めます。'},
  fine:{label:'晴れ・くもり',out:0,inn:0,say:'いつも通りの間隔です。'},
  rain:{label:'雨',out:1,inn:0,say:'屋外の鉢だけ1日ぶん遅らせます。'},
  heavy:{label:'大雨',out:2,inn:0,say:'屋外の鉢だけ2日ぶん遅らせます。'}
};
function todayW(){return (S.weather&&S.weather.date===today())?S.weather.kind:null;}
function shiftFor(pot){var k=todayW();if(!k)return 0;
  return pot.where==='outdoor'?WEATHER[k].out:WEATHER[k].inn;}

/* ===== 場所を覚えて、天気を自動で選ぶ ===== */
var GEO='https://geocoding-api.open-meteo.com/v1/search';
var FCST='https://api.open-meteo.com/v1/forecast';
var wxBusy=false, wxErr=false;

function openPlace(){
  document.getElementById('placeBox').classList.remove('hide');
  var i=document.getElementById('placeInput');
  i.value=(S.place&&S.place.name)||''; i.focus();
}
function closePlace(){
  document.getElementById('placeBox').classList.add('hide');
  document.getElementById('placeList').innerHTML='';
  document.getElementById('placeMsg').textContent='';
}
function searchPlace(){
  var q=document.getElementById('placeInput').value.trim();
  var list=document.getElementById('placeList'), msg=document.getElementById('placeMsg');
  list.innerHTML='';
  if(!q){msg.textContent='市区町村を入れてください。';return;}
  msg.textContent='さがしています…';
  fetch(GEO+'?name='+encodeURIComponent(q)+'&count=5&language=ja&format=json')
    .then(function(r){return r.json();})
    .then(function(d){
      var a=(d&&d.results)||[];
      if(!a.length){msg.textContent='見つかりませんでした。市の名前だけで試してみてください。';return;}
      msg.textContent='この中から選んでください。';
      a.forEach(function(g){
        var b=document.createElement('button');
        b.textContent=g.name+(g.admin1?'（'+g.admin1+'）':'');
        b.onclick=function(){
          S.place={name:g.name,lat:g.latitude,lon:g.longitude};
          S.weather=null; wxErr=false; save(); closePlace(); fetchWeather(true);
        };
        list.appendChild(b);
      });
    })
    .catch(function(){msg.textContent='つながりませんでした。電波のよい所でもう一度おためしください。';});
}
function pickKind(p,t){
  if(p>=10)return 'heavy';
  if(p>=3)return 'rain';
  if(t>=30)return 'hot';
  return 'fine';
}
function fetchWeather(force){
  if(!S.place||wxBusy)return;
  if(!force&&S.weather&&S.weather.date===today())return;
  wxBusy=true; wxErr=false; renderWeather();
  fetch(FCST+'?latitude='+S.place.lat+'&longitude='+S.place.lon
    +'&daily=precipitation_sum,temperature_2m_max&timezone=auto&forecast_days=1')
    .then(function(r){return r.json();})
    .then(function(d){
      var dd=d&&d.daily;
      if(!dd||!dd.precipitation_sum||!dd.precipitation_sum.length)throw new Error('no data');
      var p=Number(dd.precipitation_sum[0])||0, t=Number(dd.temperature_2m_max[0])||0;
      S.weather={date:today(),kind:pickKind(p,t),auto:true,
        note:'雨 '+p.toFixed(1)+'mm・最高 '+Math.round(t)+'℃'};
      wxBusy=false; save(); renderAll();
    })
    .catch(function(){wxBusy=false; wxErr=true; renderWeather();});
}

function renderWeather(){
  var k=todayW(), box=document.getElementById('wbox'), btns=document.getElementById('wbtns');
  var line=document.getElementById('placeLine'), auto=!!(S.weather&&S.weather.auto&&S.weather.date===today());
  line.innerHTML='';
  if(!S.place){
    line.appendChild(document.createTextNode('お住まいの場所を入れておくと、天気を自動で選びます。'));
    var b0=document.createElement('button'); b0.className='linkbtn'; b0.textContent='場所を入れる';
    b0.onclick=openPlace; line.appendChild(b0);
  }else{
    if(wxBusy){
      line.appendChild(document.createTextNode('天気を調べています…'));
    }else{
      var nm=document.createElement('b'); nm.textContent=S.place.name; line.appendChild(nm);
      line.appendChild(document.createTextNode(auto?' の天気から自動で選びました。':'（手で選んだ天気を使っています）'));
    }
    var b1=document.createElement('button'); b1.className='linkbtn'; b1.textContent='場所を変える';
    b1.onclick=openPlace; line.appendChild(b1);
    if(!wxBusy&&!auto){
      var b2=document.createElement('button'); b2.className='linkbtn'; b2.textContent='自動に戻す';
      b2.onclick=function(){fetchWeather(true);}; line.appendChild(b2);
    }
  }
  btns.innerHTML='';
  Object.keys(WEATHER).forEach(function(key){
    var b=document.createElement('button');
    b.className='wbtn'+(k===key?' on':''); b.textContent=WEATHER[key].label;
    b.onclick=function(){S.weather={date:today(),kind:key,auto:false};save();renderAll();};
    btns.appendChild(b);
  });
  box.className='box'+(k?'':' ask');
  var say=k?WEATHER[k].say:'';
  if(k&&auto&&S.weather.note)say+='（'+S.weather.note+'）';
  if(wxErr)say=(k?say+' ':'')+'※天気を取れませんでした。下から選んでください。';
  document.getElementById('wsay').textContent=say;
}
document.getElementById('placeSearch').onclick=searchPlace;
document.getElementById('placeInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();searchPlace();}});

/* ===== 状態 ===== */
function stat(pot){
  var days=pot.last?diff(pot.last,today()):null;
  var need=Math.max(1,pot.interval+shiftFor(pot));
  var kind=days===null?'none':(days===0?'done':(days<need?'wait':'due'));
  return {days:days,need:need,kind:kind,left:days===null?null:need-days};
}
var ORDER={due:0,none:1,wait:2,done:3};
function sorted(){
  return S.pots.map(function(p){return {p:p,s:stat(p)};}).sort(function(a,b){
    var d=ORDER[a.s.kind]-ORDER[b.s.kind]; if(d)return d;
    if(a.s.kind==='wait')return a.s.left-b.s.left;
    if(a.s.kind==='due')return b.s.days-a.s.days;
    return 0;});
}

/* ===== 今日あげる鉢 ===== */
function renderTodo(){
  var el=document.getElementById('todo');
  if(S.pots.length===0){el.innerHTML='';return;}

  var all=sorted();
  var due=all.filter(function(x){return x.s.kind==='due';});
  var none=all.filter(function(x){return x.s.kind==='none';});
  var soon=all.filter(function(x){return x.s.kind==='wait'&&x.s.left===1;});
  var rows=due.concat(none);

  var html='<div class="todo"><p class="label">今日あげる鉢'+
    (rows.length?'（'+rows.length+'つ）':'')+'</p>';

  if(rows.length===0){
    html+='<p class="rest">今日はお休みで大丈夫です。</p>';
  }else{
    rows.forEach(function(x){
      var note=(x.s.kind==='none')?'まだ記録がありません':'前回から'+x.s.days+'日';
      html+='<div class="todo-row"><div><span class="todo-name"></span>'+
        '<span class="todo-since">'+note+'</span></div>'+
        '<button class="mini" data-go="'+x.p.id+'">あげた</button></div>';
    });
  }

  if(soon.length>0){
    html+='<p class="wsay">明日は '+soon.length+' つあげる日です。</p>';
  }
  if(!todayW()){

/* ===== 鉢一覧 ===== */
var editing=null;
function renderPots(){
  var box=document.getElementById('pots'); box.innerHTML='';
  if(S.pots.length===0){box.innerHTML='<p class="empty">まだ鉢がありません。下から増やしてください。</p>';return;}
  sorted().forEach(function(x){
    var p=x.p,s=x.s,sh=shiftFor(p);
    var lead;
    if(s.kind==='none') lead='<span class="word none">まだ記録がありません</span>';
    else if(s.kind==='done') lead='<span class="word done">今日あげました</span>';
    else if(s.kind==='due') lead='<span class="word due">そろそろ</span><p class="since">前回から '+s.days+' 日</p>';
    else lead='<span>あと </span><span class="big">'+s.left+'</span><span> 日</span><p class="since">前回から '+s.days+' 日</p>';

    var dots='',n=Math.min(Math.max(s.need,s.days||0),21);
    for(var i=0;i<n;i++){
      var on=(s.days!==null&&i<s.days), g=(i>=p.interval&&i<s.need);
      dots+='<span class="dot'+(on?' on':'')+(g&&!on?' grace':'')+'"></span>';
    }

    var el=document.createElement('div');
    el.className='pot '+s.kind;
    el.innerHTML=
      '<div class="head"><div class="idbox">'+
        (p.photo?'<img class="thumb" src="'+p.photo+'" alt="">':'')+
        '<div><h3 class="name"></h3><p class="sub">'+(p.where==='outdoor'?'屋外':'室内')+'・'+p.interval+'日おき'+
        (sh?'（天気で '+(sh>0?'+':'')+sh+'日）':'')+'</p></div></div>'+
        '<button class="fix" data-fix="'+p.id+'">'+(editing===p.id?'閉じる':'直す')+'</button></div>'+
      (editing===p.id?
        '<div class="edit">'+
          '<div class="field"><label>名前</label><input type="text" data-name="'+p.id+'" value=""></div>'+
          '<div class="field"><label>置き場所</label><div class="toggle">'+
            '<button data-where="'+p.id+'|indoor" class="'+(p.where==='indoor'?'on':'')+'">室内</button>'+
            '<button data-where="'+p.id+'|outdoor" class="'+(p.where==='outdoor'?'on':'')+'">屋外</button>'+
          '</div></div>'+
          '<div class="field"><label>水やりの間隔</label><select data-int="'+p.id+'">'+
            [1,2,3,4,5,6,7,10,14,21].map(function(v){return '<option value="'+v+'"'+(p.interval===v?' selected':'')+'>'+v+'日おき</option>';}).join('')+
          '</select></div>'+
          '<div class="field"><label>写真</label><span class="photo-btn" data-photo="'+p.id+'">'+(p.photo?'撮り直す':'写真をつける')+'</span></div>'+
          '<div class="field"><label>名前しらべ</label>'+
            (p.photo
              ? '<span class="photo-btn'+(p.busy?' busy':'')+'" data-ai="'+p.id+'">'+(p.busy?'調べています…':'写真から名前を調べる')+'</span> '
              : '')+
            '<span class="photo-btn'+(p.busy?' busy':'')+'" data-ain="'+p.id+'">'+(p.busy?'調べています…':'この名前で育て方を調べ直す')+'</span>'+
          '</div>'+
          aiBox(p)+
          '<button class="del" data-del="'+p.id+'">この鉢を消す</button>'+
        '</div>':'')+
      '<div class="lead">'+lead+'</div><div class="dots">'+dots+'</div>'+
      '<div class="acts">'+
        (s.kind==='done'?'<span class="go fin">済み</span>':'<button class="go" data-go="'+p.id+'">水をあげた</button>')+
        (p.prev!==undefined?'<button class="undo" data-undo="'+p.id+'">1回戻す</button>':'')+
      '</div>';
    el.querySelector('.name').textContent=p.name;
    var ni=el.querySelector('[data-name]'); if(ni)ni.value=p.name;
    box.appendChild(el);
  });
}

function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function aiBox(p){
  if(p.aiErr) return '<p class="ai-err">'+esc(p.aiErr)+'</p>';
  var a=p.ai; if(!a) return '';
  var conf={high:'たぶん合っています',medium:'似た種類かもしれません',low:'自信は低めです'}[a.confidence]||'';
  var also=(a.alsoKnownAs&&a.alsoKnownAs.length)?'（別名：'+esc(a.alsoKnownAs.join('、'))+'）':'';
  var d='';
  if(a.water) d+='<dt>水やり</dt><dd>'+esc(a.water)+'</dd>';
  if(a.light) d+='<dt>置き場所</dt><dd>'+esc(a.light)+'</dd>';
  if(a.notes) d+='<dt>気をつけること</dt><dd>'+esc(a.notes)+'</dd>';
  var n=Number(a.intervalDays);
  var use=(a.name&&a.name!=='判定できませんでした')
    ? '<button class="ai-use" data-aiuse="'+p.id+'">この名前にする'+(n>0?'（'+n+'日おき）':'')+'</button>' : '';
  return '<div class="ai-box"><h4>'+esc(a.name)+also+'</h4>'+
    (conf?'<p class="conf">'+conf+'。ちがっていたら名前は自分で直せます</p>':'')+
    (d?'<dl>'+d+'</dl>':'')+use+'</div>';
}

function askAIName(id){

  if(!nm){p.aiErr='先に名前を入れてください。';renderPots();return;}
  p.busy=true; delete p.aiErr; renderPots();

  fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:nm})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(res){

    else { p.ai=res.j; delete p.aiErr; }

function askAINew(){
  var m=/^data:(image\/[a-z]+);base64,(.+)$/.exec(newPhoto||'');
  if(!m){newErr='写真を読み取れませんでした。撮り直してください。';renderNewBox();return;}
  newBusy=true; newErr=null; newAI=null; renderNewBox();

  fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mimeType:m[1],imageBase64:m[2]})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})

/* ===== 控え（バックアップ） ===== */
/* 控えファイルの形式。中身の形を変えるときは BK_FORMAT_VERSION を上げ、
   bkValidate() で古い版も読めるようにする（古い控えが読めなくならないように）。 */
var APP_VERSION='2026.10.16';
var BK_FORMAT='mizuyari-backup', BK_FORMAT_VERSION=1, BK_REMIND_DAYS=14, BK_MAX_BYTES=50*1024*1024;
/* 既存のキー mizuyari-v1 はそのままにして、控えのためにこの2つだけを新しく使う */
var BK_LAST_KEY='mizuyari-v1-lastBackupAt', BK_BEFORE_KEY='mizuyari-v1-beforeImport';
var bkLastMem=null, bkDismissed=false, bkPending=null;
var BK_UNCHANGED='（今のデータは変更していません）';

function bkGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function pad2(n){return String(n).padStart(2,'0');}
function bkWhen(iso){var d=new Date(iso);if(isNaN(d.getTime()))return '';
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function bkSize(n){return n>=1024*1024?(n/1024/1024).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function bkCount(d){var ph=d.pots.filter(function(p){return !!p.photo;}).length;
  return '鉢 '+d.pots.length+'つ（写真つき '+ph+'つ）'+(d.place&&d.place.name?'・場所「'+d.place.name+'」':'');}
function bkMsg(err,ok){document.getElementById('bkErr').textContent=err||'';document.getElementById('bkOk').textContent=ok||'';}
function bkBuild(){return {format:BK_FORMAT,formatVersion:BK_FORMAT_VERSION,appVersion:APP_VERSION,
  exportedAt:new Date().toISOString(),key:KEY,data:S};}

function bkLastAt(){
  var a=[bkGet(BK_LAST_KEY),bkLastMem].filter(function(v){return v&&!isNaN(new Date(v).getTime());});
  if(!a.length)return null;
  return a.sort(function(x,y){return new Date(y)-new Date(x);})[0];
}
function bkSetLast(iso){bkLastMem=iso;try{localStorage.setItem(BK_LAST_KEY,iso);}catch(e){}}

/* 書き出し日時・画面上部の案内・「読み込む前の状態に戻す」を、今の状態に合わせて出し直す */
function bkRender(){
  var last=bkLastAt();
  document.getElementById('bkLast').textContent=last?'最後に書き出した日時：'+bkWhen(last):'まだ一度も書き出していません';
  var days=last?Math.floor((Date.now()-new Date(last).getTime())/86400000):null;
  /* 鉢が無いときは、書き出し日時も一緒に消えている可能性があるので案内しない */
  var need=S.pots.length>0&&!bkDismissed&&(days===null||days>=BK_REMIND_DAYS);
  document.getElementById('bkRemindText').textContent=days===null
    ?'まだ一度も控えを書き出していません。スマホのデータ消去などで鉢が消えても戻せるよう、控えを書き出しましょう。'
    :'最後に控えを書き出してから'+days+'日たちました。控えを書き出しましょう。';
  document.getElementById('bkRemind').classList.toggle('hide',!need);

  /* 読み込む前に鉢が無かった場合は、戻すと読み込んだ鉢が消えるだけなのでボタンを出さない */
  var b=bkReadBefore(), has=!!(b&&b.data.pots.length);
  document.getElementById('bkUndo').classList.toggle('hide',!has);
  document.getElementById('bkUndoInfo').textContent=has?bkWhen(b.exportedAt)+'に読み込む前の状態（'+bkCount(b.data)+'）を1回分だけ取ってあります':'';
}

function bkExport(){
  var b=bkBuild(), name='水やりメモ_バックアップ_'+today()+'.json', blob;
  try{
    blob=new Blob([JSON.stringify(b)],{type:'application/json'});
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
  }catch(e){bkMsg('控えを書き出せませんでした。時間をおいてもう一度お試しください。','');return;}
  bkSetLast(b.exportedAt);
  bkMsg('','控えを書き出しました（'+name+'・'+bkSize(blob.size)+'）。スマホの「ダウンロード」に保存されます。LINEの自分あてのトークやGoogleドライブなど、スマホの外にも置いておくと安心です。');
  bkRender();
}

/* 控えファイルの中身が正しい形かを確かめる。正しくなければ {error} を返し、何も変更しない。 */
function bkValidate(o){
  var NOT='このファイルは、水やりメモの控えではないようです。「控えを書き出す」で作ったファイルを選んでください。';
  if(!o||typeof o!=='object'||Array.isArray(o)||o.format!==BK_FORMAT)return {error:NOT};
  if(typeof o.formatVersion!=='number'||Math.floor(o.formatVersion)!==o.formatVersion||o.formatVersion<1)return {error:NOT};
  if(o.formatVersion>BK_FORMAT_VERSION)return {error:'このアプリより新しい版で書き出された控えのため、読み込めません。ページを読み込み直して、アプリを新しくしてからお試しください。'};
  var d=o.data;
  if(!d||typeof d!=='object'||!Array.isArray(d.pots))return {error:'控えの中身が欠けているようです（鉢の一覧がありません）。別の控えファイルでお試しください。'};
  for(var i=0;i<d.pots.length;i++){
    var p=d.pots[i];
    var ok=p&&typeof p==='object'&&!Array.isArray(p)&&typeof p.id==='string'&&p.id!==''&&
      typeof p.name==='string'&&typeof p.interval==='number'&&isFinite(p.interval)&&p.interval>0&&
      (p.photo===undefined||(typeof p.photo==='string'&&p.photo.indexOf('data:image/')===0))&&
      (p.last===undefined||(typeof p.last==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.last)));
    if(!ok)return {error:'控えの中身が壊れているようです（'+(i+1)+'つめの鉢）。別の控えファイルでお試しください。'};
  }
  if(d.place!==undefined&&d.place!==null&&!(typeof d.place==='object'&&typeof d.place.name==='string'&&
    isFinite(Number(d.place.lat))&&isFinite(Number(d.place.lon))))
    return {error:'控えの中身が壊れているようです（場所の設定）。別の控えファイルでお試しください。'};
  if(d.weather!==undefined&&d.weather!==null&&!(typeof d.weather==='object'&&typeof d.weather.date==='string'&&WEATHER[d.weather.kind]))
    return {error:'控えの中身が壊れているようです（天気の設定）。別の控えファイルでお試しください。'};
  return {data:d,exportedAt:typeof o.exportedAt==='string'?o.exportedAt:''};
}

function bkReadBefore(){
  var r=bkGet(BK_BEFORE_KEY); if(!r)return null;
  try{var v=bkValidate(JSON.parse(r));return v.error?null:v;}catch(e){return null;}
}

function bkCancel(){bkPending=null;document.getElementById('bkChoice').classList.add('hide');}

document.getElementById('bkFile').addEventListener('change',function(){
  var f=this.files&&this.files[0]; this.value=''; /* 同じファイルをもう一度選んでも反応するように */
  bkCancel(); bkMsg('','');
  if(!f)return;
  if(f.size>BK_MAX_BYTES){bkMsg('ファイルが大きすぎるため、読み込めませんでした。水やりメモの控えファイルか確かめてください。'+BK_UNCHANGED,'');return;}
  var fr=new FileReader();
  fr.onload=function(){
    var o;
    try{o=JSON.parse(String(fr.result).replace(/^﻿/,''));}
    catch(e){bkMsg('ファイルの形式が正しくないため、読み込めませんでした。「控えを書き出す」で作ったファイルを選んでください。'+BK_UNCHANGED,'');return;}
    var v=bkValidate(o);
    if(v.error){bkMsg(v.error+BK_UNCHANGED,'');return;}
    bkPending=v;
    /* 今の鉢が無ければ、失うものがないのでそのまま読み込む */
    if(S.pots.length===0){bkApply('overwrite',true);return;}
    var w=bkWhen(v.exportedAt);
    document.getElementById('bkChoiceText').textContent='控え（'+(w?w+'に書き出し・':'')+bkCount(v.data)+'）を読み込みます。\n今のデータ（'+bkCount(S)+'）をどうしますか。';
    document.getElementById('bkChoice').classList.remove('hide');
  };
  fr.onerror=function(){bkMsg('ファイルを開けませんでした。もう一度選び直してください。'+BK_UNCHANGED,'');};
  fr.readAsText(f);
});

function bkApply(mode,skipConfirm){
  var v=bkPending; if(!v)return;
  if(mode==='overwrite'&&!skipConfirm&&
    !confirm('今のデータ（鉢・写真・場所）をすべて消して、控えの内容に置き換えます。よろしいですか。\n\n読み込む前の状態は、「読み込む前の状態に戻す」で1回分だけ戻せます。'))return;
  bkCancel();
  bkImport(v,mode,false);
}

/* 「読み込む前の状態に戻す」: 取っておいた1回分で上書きする。今の状態は代わりに取っておくので、もう一度押せば戻る。 */
function bkUndo(){
  var b=bkReadBefore();
  if(!b||!b.data.pots.length){bkMsg('戻せる状態が見つかりませんでした。','');bkRender();return;}
  if(!confirm('読み込む前の状態（'+bkCount(b.data)+'）に戻します。よろしいですか。\n\n今のデータは、代わりに1回分だけ取っておきます。'))return;
  bkCancel();
  bkImport(b,'overwrite',true);
}

function bkImport(v,mode,isUndo){
  /* 1. 今のデータを、別のキーに1回分だけ取っておく。取っておけなければ何もしない。 */
  var snap=bkBuild();
  try{localStorage.setItem(BK_BEFORE_KEY,JSON.stringify(snap));}
  catch(e){bkMsg('読み込む前の状態を取っておけなかったため、読み込みを中止しました。端末の保存容量が足りない可能性があります（写真が多いと起きます）。'+BK_UNCHANGED,'');return;}

  /* 2. 読み込む内容を組み立てる。「調べています…」の途中の印は持ち込まない */
  var inc=JSON.parse(JSON.stringify(v.data)), next, added=0, skipped=0;
  inc.pots.forEach(function(p){delete p.busy;});
  if(mode==='merge'){
    /* 追加は鉢だけ。場所・天気は今の設定のまま。idが同じ鉢は今のほうを残して読み飛ばす */
    next=JSON.parse(JSON.stringify(S));
    var ids={}; next.pots.forEach(function(p){ids[p.id]=true;});
    inc.pots.forEach(function(p){if(ids[p.id]){skipped++;}else{ids[p.id]=true;next.pots.push(p);added++;}});
  }else{
    next=inc;
  }

  /* 3. 保存する。保存できなければ元に書き戻す */
  var prevRaw=bkGet(KEY);
  try{localStorage.setItem(KEY,JSON.stringify(next));}
  catch(e){
    try{if(prevRaw!==null)localStorage.setItem(KEY,prevRaw);}catch(e2){}
    bkMsg('保存できなかったため、読み込みを中止しました。端末の保存容量が足りない可能性があります（写真が多いと起きます）。'+BK_UNCHANGED,'');
    return;
  }
  S=next; mem=S; editing=null; wxErr=false;

  /* 控えのファイルで丸ごと戻した場合は、そのファイルがある＝その時点の控えはある、とみなす */
  if(mode==='overwrite'&&!isUndo&&v.exportedAt&&!isNaN(new Date(v.exportedAt).getTime())){
    var last=bkLastAt(); if(!last||new Date(v.exportedAt)>new Date(last))bkSetLast(v.exportedAt);
  }

  var msg;
  if(isUndo)msg='読み込む前の状態に戻しました。今は '+bkCount(S)+' です。';
  else if(mode==='merge')msg='今のデータに追加しました（鉢 +'+added+'つ'+(skipped?'、すでにある'+skipped+'つは読み飛ばしました':'')+'）。今は '+bkCount(S)+' です。';
  else msg='控えを読み込みました。今は '+bkCount(S)+' です。';
  bkMsg('',msg);
  renderAll(); bkRender();
  fetchWeather(false); /* 起動時と同じく、場所があって今日の天気がまだなら自動で選ぶ */
}

/* 容量が足りないときにブラウザが自動でデータを消す対象から外してもらうよう頼む。
   対応していないブラウザや断られた場合は何もしない（利用者自身が行う消去は防げない）。 */
function bkPersist(){
  try{if(navigator.storage&&typeof navigator.storage.persist==='function')navigator.storage.persist().catch(function(){});}catch(e){}
}

document.getElementById('bkExport').onclick=bkExport;
document.getElementById('bkRemindBtn').onclick=bkExport;
document.getElementById('bkRemindClose').onclick=function(){bkDismissed=true;bkRender();};
document.getElementById('bkImport').onclick=function(){document.getElementById('bkFile').click();};
document.getElementById('bkMerge').onclick=function(){bkApply('merge');};
document.getElementById('bkOverwrite').onclick=function(){bkApply('overwrite');};
document.getElementById('bkCancel').onclick=bkCancel;
document.getElementById('bkUndo').onclick=bkUndo;

renderAll();
renderNewBox();
fetchWeather(false);
bkRender();
bkPersist();
</script>
