<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水やりメモ</title>
<style>
  :root{
    --bg:#EDF1EC; --card:#fff; --ink:#1E2A22; --muted:#5E6D62; --line:#D5DCD4;
    --water:#2E6F8E; --dry:#A8681A; --dry-bg:#FDF8EF; --dry-line:#E3C79A;
    --done:#4A7A52; --done-bg:#E8F1E7; --soil:#3A2E24; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;
    font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px}
  .bar{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
  h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:21px;margin:0;letter-spacing:.06em}
  .today{color:var(--muted);font-size:14px}

  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
  .box.ask{border:2px solid var(--water)}
  .label{font-size:14px;color:var(--muted);margin:0 0 8px}
  .wbtns{display:flex;gap:6px}
  .wbtn{flex:1;padding:11px 2px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:15px;font-family:inherit;cursor:pointer}
  .wbtn.on{background:var(--water);border-color:var(--water);color:#fff;font-weight:600}
  .wsay{font-size:14px;color:var(--muted);margin:8px 0 0}

  .todo{background:var(--dry-bg);border:1px solid var(--dry-line);border-radius:var(--r);padding:14px;margin-bottom:18px}
  .todo p.label{color:var(--dry)}
  .todo-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--dry-line)}
  .todo-row:last-child{border-bottom:none}
  .todo-name{font-size:18px;font-weight:600}
  .todo-since{font-size:13px;color:var(--muted);margin-left:6px}
  .mini{padding:9px 16px;border:none;border-radius:10px;background:var(--water);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;flex-shrink:0}
  .rest{font-size:16px;color:var(--muted);margin:0}

  .pot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px}
  .pot.due{background:var(--dry-bg);border-color:var(--dry-line)}
  .pot.done{opacity:.7}
  .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .idbox{display:flex;gap:11px;align-items:flex-start}
  .thumb{width:54px;height:54px;object-fit:cover;border-radius:10px;flex-shrink:0}
  .name{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:20px;font-weight:600;margin:0}
  .sub{font-size:13px;color:var(--muted);margin:2px 0 0}
  .fix{background:none;border:none;color:#9AA79E;font-size:14px;font-family:inherit;cursor:pointer;padding:4px 6px;flex-shrink:0}

  .lead{margin:11px 0 0}
  .big{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--water)}
  .word{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:23px;font-weight:600}
  .word.due{color:var(--dry)} .word.done{color:var(--done);font-size:20px} .word.none{color:var(--muted);font-size:18px}
  .since{font-size:13px;color:var(--muted);margin:2px 0 0}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
  .dot.on{background:var(--soil);border-color:var(--soil)}
  .dot.grace{border-color:var(--water);border-style:dashed}

  .acts{display:flex;gap:8px;margin-top:13px}
  .go{flex:1;padding:13px;border:none;border-radius:12px;background:var(--water);color:#fff;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer}
  .go.fin{background:var(--done-bg);color:var(--done);text-align:center}
  .undo{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:15px;font-family:inherit;cursor:pointer}

  .edit{background:#F7F9F6;border-radius:10px;padding:12px;margin-top:11px}
  .edit label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  .edit .field{margin-bottom:11px}
  input[type=text],select{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .toggle{display:flex;gap:6px}
  .toggle button{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-family:inherit;font-size:15px;cursor:pointer}
  .toggle button.on{background:var(--soil);border-color:var(--soil);color:#fff;font-weight:600}
  .del{background:none;border:none;color:var(--dry);font-size:14px;font-family:inherit;text-decoration:underline;cursor:pointer;padding:0}
  .photo-btn{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-size:14px;cursor:pointer}
  .photo-btn.busy{opacity:.55}
  .ai-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:11px}
  .ai-box h4{margin:0 0 3px;font-size:16px;color:var(--ink)}
  .ai-box .conf{font-size:12px;color:var(--muted);margin:0 0 8px}
  .ai-box dl{margin:0 0 9px}
  .ai-box dt{font-size:12px;color:var(--muted);margin-top:6px}
  .ai-box dd{margin:1px 0 0;font-size:14px;line-height:1.6}
  .ai-use{width:100%;padding:10px;border:none;border-radius:9px;background:var(--soil);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
  .ai-err{color:var(--dry);font-size:13px;margin:0}

  .add label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  .add .thumb-row{display:flex;align-items:center;gap:10px}
  .add h2{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:17px;margin:0 0 10px;font-weight:600}
  .addbtn{width:100%;padding:13px;border:none;border-radius:11px;background:var(--soil);color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:24px 10px}
  .note{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;line-height:1.8}
  :focus-visible{outline:3px solid var(--water);outline-offset:2px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar"><h1>水やりメモ</h1><span class="today" id="todayLabel"></span></div>

  <div class="box ask" id="wbox">
    <p class="label">今日の天気は？</p>
    <div class="wbtns" id="wbtns"></div>
    <p class="wsay" id="wsay"></p>
  </div>

  <div id="todo"></div>
  <div id="pots"></div>

  <div class="box add">
    <h2>鉢を増やす</h2>
    <div class="field" style="margin-bottom:10px">
      <label>写真から始める</label>
      <div id="newShot"></div>
      <div id="newAiBox"></div>
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>名前</label>
      <input type="text" id="newName" placeholder="鉢の名前（例：玄関のカポック）">
    </div>
    <div class="toggle" id="newWhere" style="margin-bottom:10px">
      <button data-w="indoor" class="on">室内</button>
      <button data-w="outdoor">屋外</button>
    </div>
    <div class="field" style="margin-bottom:10px">
      <select id="newInterval">
        <option value="1">1日おき</option><option value="2">2日おき</option>
        <option value="3" selected>3日おき</option><option value="4">4日おき</option>
        <option value="5">5日おき</option><option value="7">7日おき</option>
        <option value="10">10日おき</option><option value="14">14日おき</option>
      </select>
    </div>
    <button class="addbtn" id="addBtn">増やす</button>
  </div>

  <p class="note">
    記録はこの端末の中だけに残ります。<br>
    「直す」から、名前・置き場所・間隔・写真をいつでも変えられます。
  </p>
</div>

<input type="file" id="fileIn" accept="image/*" capture="environment" class="hide">

<script>
/* ===== 保存 ===== */
var KEY='mizuyari-v1', mem=null;
/* 植物しらべ中継サーバー */
var AI_URL='https://plant-ai.world-mahjong-union.workers.dev';
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return mem||{pots:[],weather:null};}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){
  alert('保存できませんでした。写真が多すぎるかもしれません。');}}
var S=load();
if(!S.pots) S.pots=[];

/* ===== 日付 ===== */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return ymd(new Date());}
function diff(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);
  return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/86400000);}
(function(){var d=new Date();
  document.getElementById('todayLabel').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（'+['日','月','火','水','木','金','土'][d.getDay()]+'）';})();

/* ===== 天気 ===== */
var WEATHER={
  hot:{label:'暑い',out:-1,inn:-1,say:'乾きが早いので1日早めます。'},
  fine:{label:'晴れ・くもり',out:0,inn:0,say:'いつも通りの間隔です。'},
  rain:{label:'雨',out:1,inn:0,say:'屋外の鉢だけ1日ぶん遅らせます。'},
  heavy:{label:'大雨',out:2,inn:0,say:'屋外の鉢だけ2日ぶん遅らせます。'}
};
function todayW(){return (S.weather&&S.weather.date===today())?S.weather.kind:null;}
function shiftFor(pot){var k=todayW();if(!k)return 0;
  return pot.where==='outdoor'?WEATHER[k].out:WEATHER[k].inn;}

function renderWeather(){
  var k=todayW(), box=document.getElementById('wbox'), btns=document.getElementById('wbtns');
  btns.innerHTML='';
  Object.keys(WEATHER).forEach(function(key){
    var b=document.createElement('button');
    b.className='wbtn'+(k===key?' on':''); b.textContent=WEATHER[key].label;
    b.onclick=function(){S.weather={date:today(),kind:key};save();renderAll();};
    btns.appendChild(b);
  });
  box.className='box'+(k?'':' ask');
  document.getElementById('wsay').textContent=k?WEATHER[k].say:'';
}

/* ===== 状態 ===== */
function stat(pot){
  var days=pot.last?diff(pot.last,today()):null;
  var need=Math.max(1,pot.interval+shiftFor(pot));
  var kind=days===null?'none':(days===0?'done':(days<need?'wait':'due'));
  return {days:days,need:need,kind:kind,left:days===null?null:need-days};
}
var ORDER={due:0,none:1,wait:2,done:3};
function sorted(){
  return S.pots.map(function(p){return {p:p,s:stat(p)};}).sort(function(a,b){
    var d=ORDER[a.s.kind]-ORDER[b.s.kind]; if(d)return d;
    if(a.s.kind==='wait')return a.s.left-b.s.left;
    if(a.s.kind==='due')return b.s.days-a.s.days;
    return 0;});
}

/* ===== 今日あげる鉢 ===== */
function renderTodo(){
  var el=document.getElementById('todo');
  if(!todayW()){el.innerHTML='';return;}
  var due=sorted().filter(function(x){return x.s.kind==='due';});
  var none=sorted().filter(function(x){return x.s.kind==='none';}).length;
  var html='<div class="todo"><p class="label">今日あげる鉢</p>';
  if(due.length===0){html+='<p class="rest">今日はお休みで大丈夫です。</p>';}
  else{
    due.forEach(function(x){
      html+='<div class="todo-row"><div><span class="todo-name"></span>'+
        '<span class="todo-since">前回から'+x.s.days+'日</span></div>'+
        '<button class="mini" data-go="'+x.p.id+'">あげた</button></div>';
    });
  }
  if(none>0){html+='<p class="wsay">まだ記録のない鉢が '+none+' つあります。</p>';}
  html+='</div>';
  el.innerHTML=html;
  var names=el.querySelectorAll('.todo-name');
  due.forEach(function(x,i){if(names[i])names[i].textContent=x.p.name;});
}

/* ===== 鉢一覧 ===== */
var editing=null;
function renderPots(){
  var box=document.getElementById('pots'); box.innerHTML='';
  if(S.pots.length===0){box.innerHTML='<p class="empty">まだ鉢がありません。下から増やしてください。</p>';return;}
  sorted().forEach(function(x){
    var p=x.p,s=x.s,sh=shiftFor(p);
    var lead;
    if(s.kind==='none') lead='<span class="word none">まだ記録がありません</span>';
    else if(s.kind==='done') lead='<span class="word done">今日あげました</span>';
    else if(s.kind==='due') lead='<span class="word due">そろそろ</span><p class="since">前回から '+s.days+' 日</p>';
    else lead='<span>あと </span><span class="big">'+s.left+'</span><span> 日</span><p class="since">前回から '+s.days+' 日</p>';

    var dots='',n=Math.min(Math.max(s.need,s.days||0),21);
    for(var i=0;i<n;i++){
      var on=(s.days!==null&&i<s.days), g=(i>=p.interval&&i<s.need);
      dots+='<span class="dot'+(on?' on':'')+(g&&!on?' grace':'')+'"></span>';
    }

    var el=document.createElement('div');
    el.className='pot '+s.kind;
    el.innerHTML=
      '<div class="head"><div class="idbox">'+
        (p.photo?'<img class="thumb" src="'+p.photo+'" alt="">':'')+
        '<div><h3 class="name"></h3><p class="sub">'+(p.where==='outdoor'?'屋外':'室内')+'・'+p.interval+'日おき'+
        (sh?'（天気で '+(sh>0?'+':'')+sh+'日）':'')+'</p></div></div>'+
        '<button class="fix" data-fix="'+p.id+'">'+(editing===p.id?'閉じる':'直す')+'</button></div>'+
      (editing===p.id?
        '<div class="edit">'+
          '<div class="field"><label>名前</label><input type="text" data-name="'+p.id+'" value=""></div>'+
          '<div class="field"><label>置き場所</label><div class="toggle">'+
            '<button data-where="'+p.id+'|indoor" class="'+(p.where==='indoor'?'on':'')+'">室内</button>'+
            '<button data-where="'+p.id+'|outdoor" class="'+(p.where==='outdoor'?'on':'')+'">屋外</button>'+
          '</div></div>'+
          '<div class="field"><label>水やりの間隔</label><select data-int="'+p.id+'">'+
            [1,2,3,4,5,6,7,10,14,21].map(function(v){return '<option value="'+v+'"'+(p.interval===v?' selected':'')+'>'+v+'日おき</option>';}).join('')+
          '</select></div>'+
          '<div class="field"><label>写真</label><span class="photo-btn" data-photo="'+p.id+'">'+(p.photo?'撮り直す':'写真をつける')+'</span></div>'+
          '<div class="field"><label>名前しらべ</label>'+
            (p.photo
              ? '<span class="photo-btn'+(p.busy?' busy':'')+'" data-ai="'+p.id+'">'+(p.busy?'調べています…':'写真から名前を調べる')+'</span>'
              : '<span class="sub" style="font-size:13px">先に写真をつけてください</span>')+
          '</div>'+
          aiBox(p)+
          '<button class="del" data-del="'+p.id+'">この鉢を消す</button>'+
        '</div>':'')+
      '<div class="lead">'+lead+'</div><div class="dots">'+dots+'</div>'+
      '<div class="acts">'+
        (s.kind==='done'?'<span class="go fin">済み</span>':'<button class="go" data-go="'+p.id+'">水をあげた</button>')+
        (p.prev!==undefined?'<button class="undo" data-undo="'+p.id+'">1回戻す</button>':'')+
      '</div>';
    el.querySelector('.name').textContent=p.name;
    var ni=el.querySelector('[data-name]'); if(ni)ni.value=p.name;
    box.appendChild(el);
  });
}

/* ===== 植物しらべ ===== */
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function aiBox(p){
  if(p.aiErr) return '<p class="ai-err">'+esc(p.aiErr)+'</p>';
  var a=p.ai; if(!a) return '';
  var conf={high:'たぶん合っています',medium:'似た種類かもしれません',low:'自信は低めです'}[a.confidence]||'';
  var also=(a.alsoKnownAs&&a.alsoKnownAs.length)?'（別名：'+esc(a.alsoKnownAs.join('、'))+'）':'';
  var d='';
  if(a.water) d+='<dt>水やり</dt><dd>'+esc(a.water)+'</dd>';
  if(a.light) d+='<dt>置き場所</dt><dd>'+esc(a.light)+'</dd>';
  if(a.notes) d+='<dt>気をつけること</dt><dd>'+esc(a.notes)+'</dd>';
  var n=Number(a.intervalDays);
  var use=(a.name&&a.name!=='判定できませんでした')
    ? '<button class="ai-use" data-aiuse="'+p.id+'">この名前にする'+(n>0?'（'+n+'日おき）':'')+'</button>' : '';
  return '<div class="ai-box"><h4>'+esc(a.name)+also+'</h4>'+
    (conf?'<p class="conf">'+conf+'。ちがっていたら名前は自分で直せます</p>':'')+
    (d?'<dl>'+d+'</dl>':'')+use+'</div>';
}

function askAI(id){
  var p=find(id); if(!p||!p.photo||p.busy)return;
  var m=/^data:(image\/[a-z]+);base64,(.+)$/.exec(p.photo);
  if(!m){p.aiErr='写真を読み取れませんでした。撮り直してください。';renderPots();return;}
  p.busy=true; delete p.aiErr; renderPots();

  fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mimeType:m[1],imageBase64:m[2]})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(res){
    delete p.busy;
    if(!res.ok||res.j.error){ p.aiErr='うまく調べられませんでした。'+(res.j.error||''); }
    else { p.ai=res.j; delete p.aiErr; }
    save(); renderPots();
  })
  .catch(function(){
    delete p.busy;
    p.aiErr='つながりませんでした。電波を確認してもう一度お試しください。';
    renderPots();
  });
}

function renderAll(){renderWeather();renderTodo();renderPots();}

/* ===== 操作 ===== */
function find(id){return S.pots.filter(function(p){return p.id===id;})[0];}

document.body.addEventListener('click',function(e){
  var t=e.target, v;
  if((v=t.getAttribute('data-go'))){var p=find(v);p.prev=(p.last===undefined?null:p.last);p.last=today();save();renderAll();}
  else if((v=t.getAttribute('data-undo'))){var p2=find(v);if(p2.prev===null)delete p2.last;else p2.last=p2.prev;delete p2.prev;save();renderAll();}
  else if((v=t.getAttribute('data-fix'))){editing=(editing===v?null:v);renderPots();}
  else if((v=t.getAttribute('data-where'))){var a=v.split('|');find(a[0]).where=a[1];save();renderAll();}
  else if((v=t.getAttribute('data-del'))){var p3=find(v);
    if(confirm('「'+p3.name+'」を消します。よろしいですか。')){S.pots=S.pots.filter(function(q){return q.id!==v;});editing=null;save();renderAll();}}
  else if((v=t.getAttribute('data-photo'))){photoTarget=v;document.getElementById('fileIn').click();}
  else if((v=t.getAttribute('data-ai'))){askAI(v);}
  else if((v=t.getAttribute('data-aiuse'))){var p4=find(v);
    if(p4.ai){ if(p4.ai.name)p4.name=p4.ai.name;
      var n=Number(p4.ai.intervalDays); if(n>0&&n<=60)p4.interval=n; }
    save(); renderAll();}
});

document.body.addEventListener('change',function(e){
  var v=e.target.getAttribute&&e.target.getAttribute('data-int');
  if(v){find(v).interval=Number(e.target.value);save();renderAll();}
});
document.body.addEventListener('input',function(e){
  var v=e.target.getAttribute&&e.target.getAttribute('data-name');
  if(v){find(v).name=e.target.value;save();
    var card=e.target.closest('.pot'); if(card)card.querySelector('.name').textContent=e.target.value;
    renderTodo();}
});

/* ===== 新規登録：写真から始める ===== */
var newPhoto=null, newAI=null, newBusy=false, newErr=null;

function renderNewBox(){
  var shot=document.getElementById('newShot');
  var box=document.getElementById('newAiBox');

  shot.innerHTML = newPhoto
    ? '<div class="thumb-row"><img class="thumb" src="'+newPhoto+'" alt="">'+
      '<span class="photo-btn'+(newBusy?' busy':'')+'" id="newShotBtn">'+(newBusy?'調べています…':'撮り直す')+'</span></div>'
    : '<span class="photo-btn" id="newShotBtn">写真をとって名前を調べる</span>';

  if(newBusy){ box.innerHTML=''; return; }
  if(newErr){ box.innerHTML='<p class="ai-err">'+esc(newErr)+'</p>'; return; }
  if(!newAI){ box.innerHTML=''; return; }

  var a=newAI;
  var conf={high:'たぶん合っています',medium:'似た種類かもしれません',low:'自信は低めです'}[a.confidence]||'';
  var also=(a.alsoKnownAs&&a.alsoKnownAs.length)?'（別名：'+esc(a.alsoKnownAs.join('、'))+'）':'';
  var d='';
  if(a.water) d+='<dt>水やり</dt><dd>'+esc(a.water)+'</dd>';
  if(a.light) d+='<dt>置き場所</dt><dd>'+esc(a.light)+'</dd>';
  if(a.notes) d+='<dt>気をつけること</dt><dd>'+esc(a.notes)+'</dd>';
  box.innerHTML='<div class="ai-box"><h4>'+esc(a.name)+also+'</h4>'+
    (conf?'<p class="conf">'+conf+'。下の名前の欄でいつでも直せます</p>':'')+
    (d?'<dl>'+d+'</dl>':'')+'</div>';
}

function askAINew(){
  var m=/^data:(image\/[a-z]+);base64,(.+)$/.exec(newPhoto||'');
  if(!m){newErr='写真を読み取れませんでした。撮り直してください。';renderNewBox();return;}
  newBusy=true; newErr=null; newAI=null; renderNewBox();

  fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mimeType:m[1],imageBase64:m[2]})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(res){
    newBusy=false;
    if(!res.ok||res.j.error){ newErr='うまく調べられませんでした。名前は手で入れてください。'; }
    else{
      newAI=res.j;
      var nm=document.getElementById('newName');
      if(newAI.name && newAI.name!=='判定できませんでした' && !nm.value.trim()) nm.value=newAI.name;
      var n=Number(newAI.intervalDays), sel=document.getElementById('newInterval');
      if(n>0){
        var best=null;
        Array.prototype.forEach.call(sel.options,function(o){
          var v=Number(o.value);
          if(best===null||Math.abs(v-n)<Math.abs(best-n)) best=v;
        });
        if(best!==null) sel.value=String(best);
      }
    }
    renderNewBox();
  })
  .catch(function(){
    newBusy=false;
    newErr='つながりませんでした。名前は手で入れてください。';
    renderNewBox();
  });
}

document.getElementById('newShot').addEventListener('click',function(e){
  if(e.target.id!=='newShotBtn'||newBusy)return;
  photoTarget='__new__';
  document.getElementById('fileIn').click();
});

/* 追加 */
var newWhere='indoor';
document.getElementById('newWhere').addEventListener('click',function(e){
  var w=e.target.getAttribute('data-w'); if(!w)return;
  newWhere=w;
  Array.prototype.forEach.call(this.children,function(b){b.className=(b.getAttribute('data-w')===w?'on':'');});
});
document.getElementById('addBtn').addEventListener('click',function(){
  var i=document.getElementById('newName'), name=i.value.trim();
  if(!name){i.focus();return;}
  var pot={id:'p'+Date.now(),name:name,where:newWhere,
    interval:Number(document.getElementById('newInterval').value)};
  if(newPhoto) pot.photo=newPhoto;
  if(newAI) pot.ai=newAI;
  S.pots.push(pot);
  i.value=''; newPhoto=null; newAI=null; newErr=null;
  document.getElementById('newInterval').value='3';
  renderNewBox(); save(); renderAll();
});
document.getElementById('newName').addEventListener('keydown',function(e){
  if(e.key==='Enter')document.getElementById('addBtn').click();});

/* 写真 */
var photoTarget=null;
document.getElementById('fileIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value='';
  if(!f||!photoTarget)return;
  var forNew=(photoTarget==='__new__');
  var pot=forNew?null:find(photoTarget);
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=420, sc=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var url=c.toDataURL('image/jpeg',0.7);
      if(forNew){ newPhoto=url; newAI=null; newErr=null; renderNewBox(); askAINew(); return; }
      pot.photo=url;
      delete pot.ai; delete pot.aiErr;
      save(); renderPots();
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
});

renderAll();
renderNewBox();
</script>
</body>
</html>
